[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soundscape"
version = "0.1.0"
description = "Pipeline to extract frames and metadata from GoPro sound meter recordings for OCR analysis"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Gaurav Sood" }]
keywords = ["gopro", "video-processing", "ocr", "sound-meter", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "pillow>=12.3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
    "requests>=2.31",
    "docstring-parser>=0.18.0",
]

[project.optional-dependencies]
maps = [
    "contextily>=1.4",
    "folium>=0.14",
    "geopandas>=0.14",
    "shapely>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pydoclint>=0.8",
]
all = [
    "soundscape[maps]",
]

[project.scripts]
soundscape = "soundscape.cli:main"

[project.urls]
Homepage = "https://github.com/soodoku/soundscape"
Repository = "https://github.com/soodoku/soundscape"

[tool.hatch.build.targets.wheel]
packages = ["src/soundscape"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = true
check-yield-types = true

[tool.pytest.ini_options]
testpaths = ["tests"]
